name: Actions self-check

on:
  push:
    branches: [zygisk-port-3.1.0-rc6]

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove that a job can start at all
        run: |
          echo "actions-selfcheck-ok"
          uname -a

name: XAutoDaily Zygisk CI

on:
  push:
    branches: [zygisk-port-3.1.0-rc6]
  pull_request:
    branches: [zygisk-port-3.1.0-rc6]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref: the Android/NDK toolchain download plus the two-ABI
# native build is expensive, and only the newest commit needs to prove itself.
concurrency:
  group: zygisk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-24.04
    # Cold runner: SDK/NDK/CMake downloads, Gradle dependency resolution, the app build and the
    # two-ABI native build have never run end to end on a real runner. Budget for the first run.
    timeout-minutes: 120
    steps:
      - name: Checkout (including pinned native dependencies)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned OpenSSL archives
        run: python3 source/zygisk/tests/verify_openssl_archives.py

      - name: Source-level verification (compile, unit tests, API 82 table, native API, packaging refusals)
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          bash source/zygisk/tests/verify_local_port.sh

      - name: Unit tests and source-rebuilt payload APK
        run: |
          chmod +x source/gradlew source/zygisk/build-native.sh source/zygisk/build-zygisk.sh
          ./source/gradlew --no-daemon -p source -PzygiskPort=true :app:testDebugUnitTest :app:assembleDebug

      - name: Verify Xposed API 82 JNI registration table and vendored sources
        run: |
          curl --retry 3 --fail --silent --show-error https://api.xposed.info/de/robv/android/xposed/api/82/api-82-sources.jar -o /tmp/xposed-api-82-sources.jar
          python3 source/zygisk/tests/verify_xposed_api82.py \
            /tmp/xposed-api-82-sources.jar source/app/src/main/cpp/zygisk_hook.cpp \
            --vendored source/xposed-api82/src/main/java

      - name: Build Zygisk loader for both ABIs and package candidate
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          # Use the pinned CMake/Ninja from the SDK rather than whatever the runner image ships,
          # so the native build uses the toolchain this workflow declares.
          export CMAKE_BIN="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          export NINJA_BIN="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          export PAYLOAD_APK="$GITHUB_WORKSPACE/source/app/build/outputs/apk/debug/app-debug.apk"
          export PAYLOAD_KIND=source-rebuild
          export SUPPORT_APK="$GITHUB_WORKSPACE/source/app/build/outputs/apk/debug/app-debug.apk"
          source/zygisk/build-zygisk.sh

      - name: Verify APK payload metadata and native ELF exports
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='me.teble.xposed.autodaily' versionCode='26112014' versionName='3.1.0-rc6'"
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libxautodaily_hook.so liblsplant.so libdobby.so; do
              unzip -l "$APK" "lib/$abi/$lib" | grep -F "$lib" >/dev/null
            done
            file "source/zygisk/module/zygisk/$abi.so"
            readelf -h "source/zygisk/module/zygisk/$abi.so" | grep -E 'Class:|Machine:'
            nm -D "source/zygisk/module/zygisk/$abi.so" | grep -q 'zygisk_module_entry'
          done
          sha256sum "$APK" build/XAutoDaily-Zygisk-3.1.0-rc6-source-rebuild.zip

      - name: Upload source-rebuild candidate and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xautodaily-zygisk-source-rebuild
          if-no-files-found: warn
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            build/XAutoDaily-Zygisk-3.1.0-rc6-source-rebuild.zip
            source/app/build/reports/tests/testDebugUnitTest/**

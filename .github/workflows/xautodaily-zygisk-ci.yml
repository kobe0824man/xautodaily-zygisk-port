name: XAutoDaily Zygisk CI

on:
  push:
    branches: [zygisk-port-3.1.0-rc6]
  pull_request:
    branches: [zygisk-port-3.1.0-rc6]
  workflow_dispatch:

permissions:
  contents: read

# One build per commit, and never a build that is cancelled by another one. The group carries
# the commit SHA, so a new commit does not share a group with the build it supersedes and the
# two run side by side; cancel-in-progress is off, so a second run of the *same* commit - the
# push trigger and a manual dispatch both happen in this project - waits its turn instead of
# killing the build that is already under way. Minutes are not the constraint here: this
# repository is public, so its runners come from the unlimited free pool.
concurrency:
  group: zygisk-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (including pinned native dependencies)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # setup-android v3 defaulted to installing the retired `tools` package, which no longer
      # exists in the SDK repository: the job died with "Failed to find package 'tools'" before
      # it ever reached the build. v4 installs `platform-tools` instead and runs on Node 24.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # The runner image ships several cmdline-tools versions and the setup action installs
          # its own. Take the newest numeric one rather than trusting the `latest` symlink, which
          # the image can leave pointing at an older release.
          SDKMANAGER=""
          for CANDIDATE in $(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null \
                              | grep -v '/latest/' | sort -V -r || true); do
            if [ -x "$CANDIDATE" ]; then SDKMANAGER="$CANDIDATE"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify pinned OpenSSL archives
        run: python3 source/zygisk/tests/verify_openssl_archives.py

      - name: Unit tests and source-rebuilt payload APK
        run: |
          chmod +x source/gradlew source/zygisk/build-native.sh source/zygisk/build-zygisk.sh
          ./source/gradlew --no-daemon -p source -PzygiskPort=true :app:testDebugUnitTest :app:assembleDebug

      - name: Verify Xposed API 82 JNI registration table
        run: |
          curl --retry 3 --fail --silent --show-error https://api.xposed.info/de/robv/android/xposed/api/82/api-82-sources.jar -o /tmp/xposed-api-82-sources.jar
          python3 source/zygisk/tests/verify_xposed_api82.py /tmp/xposed-api-82-sources.jar source/app/src/main/cpp/zygisk_hook.cpp

      - name: Build Zygisk loader for both ABIs and package candidate
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export PAYLOAD_APK="$GITHUB_WORKSPACE/source/app/build/outputs/apk/debug/app-debug.apk"
          export PAYLOAD_KIND=source-rebuild
          source/zygisk/build-zygisk.sh

      - name: Verify APK payload metadata and native ELF exports
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='me.teble.xposed.autodaily' versionCode='26112014' versionName='3.1.0-rc6'"
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libxautodaily_hook.so liblsplant.so libdobby.so; do
              unzip -l "$APK" "lib/$abi/$lib" | grep -F "$lib" >/dev/null
            done
            file "source/zygisk/module/zygisk/$abi.so"
            readelf -h "source/zygisk/module/zygisk/$abi.so" | grep -E 'Class:|Machine:'
            nm -D "source/zygisk/module/zygisk/$abi.so" | grep -q 'zygisk_module_entry'
          done
          sha256sum "$APK" build/XAutoDaily-Zygisk-3.1.0-rc6-source-rebuild.zip

      - name: Upload source-rebuild candidate and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xautodaily-zygisk-source-rebuild
          if-no-files-found: warn
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            build/XAutoDaily-Zygisk-3.1.0-rc6-source-rebuild.zip
            source/app/build/reports/tests/testDebugUnitTest/**
